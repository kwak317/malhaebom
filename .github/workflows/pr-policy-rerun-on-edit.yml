name: PR Policy Check Rerun on Edit

on:
  pull_request:
    types: [edited]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-edit-rerun-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rerun-pr-policy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Re-run policy check for current PR HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            runs_json="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow pr-policy-check.yml \
              --commit "${HEAD_SHA}" \
              --event pull_request \
              --limit 10 \
              --json databaseId,status,headSha,createdAt)"

            run_id="$(printf '%s' "${runs_json}" | jq -r --arg sha "${HEAD_SHA}" \
              '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
            run_status="$(printf '%s' "${runs_json}" | jq -r --arg sha "${HEAD_SHA}" \
              '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | reverse | .[0].status // empty')"

            if [[ -z "${run_id}" ]]; then
              echo "PR #${PR_NUMBER}: waiting for a policy run for HEAD ${HEAD_SHA} (attempt ${attempt}/30)"
              sleep 2
              continue
            fi

            if [[ "${run_status}" == "completed" ]]; then
              current_head_sha="$(gh api \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                --jq '.head.sha')"

              if [[ "${current_head_sha}" != "${HEAD_SHA}" ]]; then
                echo "PR #${PR_NUMBER}: HEAD advanced from ${HEAD_SHA} to ${current_head_sha}; skipping obsolete policy rerun."
                exit 0
              fi

              echo "PR #${PR_NUMBER}: rerunning policy run ${run_id} for HEAD ${HEAD_SHA}"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun"
              exit 0
            fi

            echo "PR #${PR_NUMBER}: policy run ${run_id} is ${run_status}; waiting (attempt ${attempt}/30)"
            sleep 2
          done

          echo "::error::Could not find a completed PR Policy Check run for PR #${PR_NUMBER} HEAD ${HEAD_SHA} within 60 seconds."
          exit 1
